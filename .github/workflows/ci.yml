name: Knoxite validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: knoxite-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: knoxite-backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npm run typecheck
      - name: Restore private assessment QA inputs
        run: node development/ciAssessmentContent.cjs restore
        env:
          KNOXITE_QA_PART1: ${{ secrets.KNOXITE_QA_PART1 }}
          KNOXITE_QA_PART2: ${{ secrets.KNOXITE_QA_PART2 }}
          KNOXITE_QA_SHA256: ${{ secrets.KNOXITE_QA_SHA256 }}
      - run: npm test
      # Runner creates ownership-labelled tmpfs MySQL on random loopback ports,
      # generates private credentials, and applies ONLY prisma/release migrations.
      # Every integration file gets its own fresh database, removed in finally.
      - run: docker pull mysql:8.4
      - run: node development/ciIntegration.cjs
      - run: npm audit --audit-level=moderate
      - name: Remove owned private QA inputs
        if: always()
        run: node development/ciAssessmentContent.cjs cleanup
  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: http://127.0.0.1:5009/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install backend dependencies for browser tests
        working-directory: knoxite-backend
        run: npm ci --ignore-scripts
      - name: Generate backend Prisma Client for browser tests
        working-directory: knoxite-backend
        run: npm run db:generate
      - name: Build backend utilities for browser tests
        working-directory: knoxite-backend
        run: npm run build
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --audit-level=moderate
