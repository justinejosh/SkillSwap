name: Knoxite validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-password
          MYSQL_DATABASE: knoxite_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psynthetic-ci-password --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    defaults:
      run:
        working-directory: knoxite-backend
    env:
      DATABASE_URL: mysql://root:synthetic-ci-password@127.0.0.1:3306/knoxite_test
      KNOXITE_LOCAL_DATABASE_ACK: local-synthetic-or-sanitized
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: knoxite-backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:bootstrap
      - run: npm run test:integration
      - run: npm audit --audit-level=moderate
  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: http://127.0.0.1:5009/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --audit-level=moderate
